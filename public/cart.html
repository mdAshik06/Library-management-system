<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>আমার কার্ট | Bookstore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="store-style.css" />
  <link rel="stylesheet" href="cart-style.css" />
</head>
<body>
  <header class="store-header">
    <h1>Bookstore</h1>
    <nav>
      <a href="index.html">হোম</a>
      <a href="ebooks.html">E-Book</a>
      <a href="cart.html" id="cartLink">কার্ট <span id="cartCount" style="display:none;">0</span></a>
      <a href="profile.html" id="profileLink" style="display:none;">প্রোফাইল</a>
      <a href="admin.html" id="adminDashboardLink" style="display:none;">Admin Dashboard</a>
      <a href="login.html" id="loginLink">লগিন</a>
      <button id="logoutBtn" style="display:none;">লগআউট</button>
    </nav>
  </header>

  <div class="container">
    <h2 class="page-title">আমার কার্ট</h2>
    <div id="message" class="message"></div>

    <div id="cartItemsWrap"></div>

    <div class="no-results" id="emptyCart" style="display:none;">
      আপনার কার্ট খালি। <a href="index.html">বই দেখতে এখানে ক্লিক করুন</a>
    </div>

    <div class="cart-summary" id="cartSummary" style="display:none;">
      <div class="total-row">
        <span>মোট</span>
        <span id="cartTotal">৳0</span>
      </div>
      <button class="btn checkout-btn" id="checkoutBtn">চেকআউট করুন</button>
    </div>
  </div>

  <script src="store-script.js"></script>
  <script src="cart-script.js"></script>
</body>
</html>
