<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookstore | E-Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="store-style.css" />
</head>
<body data-ebooks-only="true">
  <header class="store-header">
    <h1>Bookstore</h1>

    <div class="header-search">
      <input type="text" id="searchInput" placeholder="বই, লেখক বা ক্যাটাগরির নাম দিয়ে সার্চ করুন..." />
      <select id="categoryFilter">
        <option value="">সব ক্যাটাগরি</option>
      </select>
    </div>

    <nav>
      <a href="index.html">হোম</a>
      <a href="ebooks.html">E-Book</a>
      <a href="cart.html" id="cartLink">কার্ট <span id="cartCount" style="display:none;">0</span></a>
      <a href="wishlist.html" id="wishlistLink">উইশলিস্ট</a>
      <a href="profile.html" id="profileLink" style="display:none;">প্রোফাইল</a>
      <a href="admin.html" id="adminDashboardLink" style="display:none;">Admin Dashboard</a>
      <a href="login.html" id="loginLink">লগিন</a>
      <button id="logoutBtn" style="display:none;">লগআউট</button>
    </nav>
  </header>

  <section class="hero">
    <p class="hero-eyebrow">ডিজিটাল সংস্করণ</p>
    <h2 class="hero-title">যেসব বইয়ের PDF ভার্সন পাওয়া যায়</h2>
  </section>

  <div class="container">
    <div id="featuredSection" style="display:none;">
      <h2 class="section-title">Featured ও Bestseller</h2>
      <div class="book-grid" id="featuredGrid"></div>
    </div>

    <h2 class="section-title" id="allBooksTitle">সব E-Book</h2>
    <div class="book-grid" id="bookGrid"></div>
    <div class="no-results" id="noResults" style="display:none;">এখনো কোনো E-Book যোগ করা হয়নি।</div>
  </div>

  <script src="store-script.js"></script>
</body>
</html>
