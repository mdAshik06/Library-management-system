<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>আমার প্রোফাইল | Bookstore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="store-style.css" />
  <link rel="stylesheet" href="checkout-style.css" />
  <link rel="stylesheet" href="profile-style.css" />
</head>
<body>
  <header class="store-header">
    <h1>Bookstore</h1>
    <nav>
      <a href="index.html">হোম</a>
      <a href="ebooks.html">E-Book</a>
      <a href="cart.html">কার্ট</a>
      <a href="profile.html">প্রোফাইল</a>
      <a href="admin.html" id="adminDashboardLink" style="display:none;">Admin Dashboard</a>
      <button id="logoutBtn">লগআউট</button>
    </nav>
  </header>

  <div class="container">
    <h2 class="page-title">আমার প্রোফাইল</h2>
    <div id="message" class="message"></div>

    <div class="profile-layout">
      <!-- প্রোফাইল তথ্য এডিট -->
      <div class="panel">
        <h3>প্রোফাইল তথ্য</h3>

        <div class="profile-pic-wrap">
          <img id="profilePic" src="" alt="প্রোফাইল ছবি" class="profile-pic" />
        </div>

        <form id="profileForm" enctype="multipart/form-data">
          <div class="form-group">
            <label>প্রোফাইল ছবি পরিবর্তন করুন</label>
            <input type="file" id="profileImage" accept="image/*" />
          </div>

          <div class="form-group">
            <label>পূর্ণ নাম</label>
            <input type="text" id="fullName" required />
          </div>

          <div class="form-group">
            <label>ইমেইল</label>
            <input type="email" id="email" disabled />
            <p class="hint">ইমেইল পরিবর্তন করা যাবে না</p>
          </div>

          <div class="form-group">
            <label>মোবাইল নাম্বার</label>
            <input type="tel" id="mobile" placeholder="01XXXXXXXXX" />
          </div>

          <div class="form-group">
            <label>ঠিকানা</label>
            <textarea id="address" rows="3"></textarea>
          </div>

          <button type="submit" class="btn" id="saveProfileBtn">আপডেট করুন</button>
        </form>
      </div>

      <!-- অর্ডার হিস্টোরি -->
      <div class="panel">
        <h3>আমার অর্ডার হিস্টোরি</h3>
        <div id="orderHistory"></div>
        <div class="no-results" id="noOrders" style="display:none;">
          আপনি এখনো কোনো অর্ডার করেননি। <a href="index.html">বই দেখতে ক্লিক করুন</a>
        </div>
      </div>
    </div>
  </div>

  <script src="profile-script.js"></script>
</body>
</html>
