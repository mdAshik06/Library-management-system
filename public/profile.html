          <a class="nav-link" href="profile.html">Profile</a>

      </ul>
      <form class="d-flex" role="search">
        <input id="searchInput" class="form-control me-2" type="search" placeholder="বই, লেখক বা ক্যাটাগরির নাম" aria-label="Search"/>
        <button class="btn btn-outline-success" type="submit">Search</button>
        
      </form>

  </div>
</nav>
  <div class="container">
    <h2 class="page-title">আমার প্রোফাইল</h2>
    <div id="message" class="message"></div>

    <div class="profile-layout">
      <!-- প্রোফাইল তথ্য এডিট -->
      <div class="panel">
        <h3>প্রোফাইল তথ্য</h3>

        <div class="profile-pic-wrap">
          <img id="profilePic" src="" alt="প্রোফাইল ছবি" class="profile-pic" />
        </div>

        <form id="profileForm" enctype="multipart/form-data">
          <div class="form-group">
            <label>প্রোফাইল ছবি পরিবর্তন করুন</label>
            <input type="file" id="profileImage" accept="image/*" />
          </div>

          <div class="form-group">
            <label>পূর্ণ নাম</label>
            <input type="text" id="fullName" required />
          </div>

          <div class="form-group">
            <label>ইমেইল</label>
            <input type="email" id="email" disabled />
            <p class="hint">ইমেইল পরিবর্তন করা যাবে না</p>
          </div>

          <div class="form-group">
            <label>মোবাইল নাম্বার</label>
            <input type="tel" id="mobile" placeholder="01XXXXXXXXX" />
          </div>

          <div class="form-group">
            <label>ঠিকানা</label>
            <textarea id="address" rows="3"></textarea>
          </div>

          <button type="submit" class="btn" id="saveProfileBtn">আপডেট করুন</button>
        </form>
      </div>

      <!-- অর্ডার হিস্টোরি -->
      <div class="panel">
        <h3>আমার অর্ডার হিস্টোরি</h3>
        <div id="orderHistory"></div>
        <div class="no-results" id="noOrders" style="display:none;">
          আপনি এখনো কোনো অর্ডার করেননি। <a href="index.html">বই দেখতে ক্লিক করুন</a>
        </div>
      </div>
    </div>
  </div>

  
</body>
</html>
