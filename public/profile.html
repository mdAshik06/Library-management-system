  <div class="container">
    <h2 class="page-title">আমার প্রোফাইল</h2>
    <div id="message" class="message"></div>

    <div class="profile-layout">
      <!-- প্রোফাইল তথ্য এডিট -->
      <div class="panel">
        <h3>প্রোফাইল তথ্য</h3>

        <div class="profile-pic-wrap">
          <img id="profilePic" src="" alt="প্রোফাইল ছবি" class="profile-pic" />
        </div>

        <form id="profileForm" enctype="multipart/form-data" class="needs-validation" novalidate>
  <!-- প্রোফাইল ছবি -->
  <div class="mb-3">
    <label for="profileImage" class="form-label fw-bold">প্রোফাইল ছবি পরিবর্তন করুন</label>
    <input class="form-control" type="file" id="profileImage" accept="image/*">
  </div>

  <!-- পূর্ণ নাম -->
  <div class="mb-3">
    <label for="fullName" class="form-label fw-bold">পূর্ণ নাম <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="fullName" placeholder="আপনার পূর্ণ নাম লিখুন" required>
    <div class="invalid-feedback">অনুগ্রহ করে আপনার নাম প্রদান করুন।</div>
  </div>

  <!-- ইমেইল -->
  <div class="mb-3">
    <label for="email" class="form-label fw-bold">ইমেইল</label>
    <input type="email" class="form-control" id="email" disabled>
    <div class="form-text text-muted">ইমেইল পরিবর্তন করা যাবে না</div>
  </div>

  <!-- মোবাইল নাম্বার -->
  <div class="mb-3">
    <label for="mobile" class="form-label fw-bold">মোবাইল নাম্বার</label>
    <input type="tel" class="form-control" id="mobile" placeholder="01XXXXXXXXX">
  </div>

  <!-- ঠিকানা -->
  <div class="mb-3">
    <label for="address" class="form-label fw-bold">ঠিকানা</label>
    <textarea class="form-control" id="address" rows="3" placeholder="আপনার ঠিকানা লিখুন"></textarea>
  </div>

  <!-- বাটন -->
  <button type="submit" class="btn btn-primary w-100" id="saveProfileBtn">আপডেট করুন</button>
</form>

      <!-- অর্ডার হিস্টোরি -->
      <div class="panel, mt-3">
        <h3>আমার অর্ডার হিস্টোরি</h3>
        <div id="orderHistory"></div>
        <div class="no-results" id="noOrders" style="display:none;">
          আপনি এখনো কোনো অর্ডার করেননি। <a href="index.html">বই দেখতে ক্লিক করুন</a>
        </div>
      </div>
    </div>
  </div>

  
</body>
