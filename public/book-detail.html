<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>বইয়ের বিস্তারিত | Bookstore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="store-style.css" />
  <link rel="stylesheet" href="book-detail-style.css" />
</head>
<body>
  <header class="store-header">
    <h1>Bookstore</h1>
    <nav>
      <a href="index.html">হোম</a>
      <a href="ebooks.html">E-Book</a>
      <a href="cart.html" id="cartLink">কার্ট <span id="cartCount" style="display:none;">0</span></a>
      <a href="wishlist.html" id="wishlistLink">উইশলিস্ট</a>
      <a href="profile.html" id="profileLink" style="display:none;">প্রোফাইল</a>
      <a href="admin.html" id="adminDashboardLink" style="display:none;">Admin Dashboard</a>
      <a href="login.html" id="loginLink">লগিন</a>
      <button id="logoutBtn" style="display:none;">লগআউট</button>
    </nav>
  </header>

  <div class="container">
    <a href="index.html" class="back-link">← সব বইয়ে ফিরে যান</a>

    <div id="message" class="message"></div>

    <div id="bookDetailWrap"></div>
    <div class="no-results" id="notFound" style="display:none;">বইটি পাওয়া যায়নি।</div>

    <!-- রিভিউ সেকশন -->
    <div class="panel review-panel" id="reviewPanel" style="display:none;">
      <h3>রিভিউ ও রেটিং</h3>

      <div class="review-summary" id="reviewSummary"></div>

      <div class="review-form-box" id="reviewFormBox">
        <h4>আপনার রিভিউ দিন</h4>
        <form id="reviewForm">
          <div class="star-input" id="starInput">
            <span data-value="1">☆</span>
            <span data-value="2">☆</span>
            <span data-value="3">☆</span>
            <span data-value="4">☆</span>
            <span data-value="5">☆</span>
          </div>
          <textarea id="reviewComment" rows="3" placeholder="বইটি সম্পর্কে আপনার মতামত লিখুন (ঐচ্ছিক)"></textarea>
          <button type="submit" class="btn">রিভিউ জমা দিন</button>
        </form>
      </div>

      <div class="review-list" id="reviewList"></div>
    </div>
  </div>

  <script src="store-script.js"></script>
  <script src="book-detail-script.js"></script>
</body>
</html>
