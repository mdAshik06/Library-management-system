<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>লগিন | Bookstore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <p class="wordmark">Bookstore</p>
    <h1>লগিন করুন</h1>
    <p class="subtitle">আপনার Bookstore একাউন্টে প্রবেশ করুন</p>

    <div id="message" class="message"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="আপনার পাসওয়ার্ড" required />
      </div>

      <button type="submit" class="btn" id="submitBtn">লগিন করুন</button>
    </form>

    <p class="switch-link">
      <a href="forgot-password.html">পাসওয়ার্ড ভুলে গেছেন?</a>
    </p>

    <p class="switch-link">
      একাউন্ট নেই? <a href="register.html">রেজিস্ট্রেশন করুন</a>
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
