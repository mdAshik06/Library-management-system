<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>রেজিস্ট্রেশন | Bookstore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <p class="wordmark">Bookstore</p>
    <h1>একাউন্ট তৈরি করুন</h1>
    <p class="subtitle">Bookstore-এ নতুন একাউন্ট খুলুন</p>

    <div id="message" class="message"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="আপনার পূর্ণ নাম" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="কমপক্ষে ৬ অক্ষর" required minlength="6" />
      </div>

      <button type="submit" class="btn" id="submitBtn">রেজিস্ট্রেশন করুন</button>
    </form>

    <p class="switch-link">
      আগে থেকেই একাউন্ট আছে? <a href="login.html">লগিন করুন</a>
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
