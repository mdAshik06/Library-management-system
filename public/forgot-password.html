<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>পাসওয়ার্ড ভুলে গেছেন? | Bookstore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <p class="wordmark">Bookstore</p>
    <h1>পাসওয়ার্ড ভুলে গেছেন?</h1>
    <p class="subtitle">আপনার একাউন্টের Email দিন, আমরা একটা reset link দেব</p>

    <div id="message" class="message"></div>

    <form id="forgotForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <button type="submit" class="btn" id="submitBtn">Reset Link পান</button>
    </form>

    <div id="resetLinkBox" style="display:none; margin-top: 18px; padding: 14px; background: #fafaf9; border: 1px solid #e4e4e2; border-radius: 6px; word-break: break-all;">
      <p style="font-size: 13px; color: #555; margin-bottom: 8px;">
        📧 <strong>Demo মোড:</strong> বাস্তবে এই লিংক ইমেইলে পাঠানো হতো। এখন টেস্ট করার জন্য নিচে দেখানো হলো:
      </p>
      <a id="resetLinkAnchor" href="#" style="color:#18181b; font-size: 13px; font-weight: 600;"></a>
    </div>

    <p class="switch-link">
      মনে পড়েছে? <a href="login.html">লগিন করুন</a>
    </p>
  </div>

  <script src="forgot-password-script.js"></script>
</body>
</html>
