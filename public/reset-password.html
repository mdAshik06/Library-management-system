<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>নতুন পাসওয়ার্ড সেট করুন | Bookstore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <p class="wordmark">Bookstore</p>
    <h1>নতুন পাসওয়ার্ড সেট করুন</h1>
    <p class="subtitle">আপনার একাউন্টের জন্য একটা নতুন পাসওয়ার্ড দিন</p>

    <div id="message" class="message"></div>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">নতুন Password</label>
        <input type="password" id="newPassword" placeholder="কমপক্ষে ৬ অক্ষর" required minlength="6" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Password আবার লিখুন</label>
        <input type="password" id="confirmPassword" placeholder="আবার লিখুন" required minlength="6" />
      </div>

      <button type="submit" class="btn" id="submitBtn">পাসওয়ার্ড পরিবর্তন করুন</button>
    </form>

    <p class="switch-link">
      <a href="login.html">লগিন পেইজে ফিরে যান</a>
    </p>
  </div>

 
</body>
</html>
